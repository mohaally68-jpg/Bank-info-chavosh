*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#0d0905;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  font-family:"Vazirmatn","Vazir","Tahoma",sans-serif;
  color:var(--ink);
}
/* پس‌زمینه‌ی محوِ کناره‌ها در صفحه‌های عریض */
body::before{
  content:"";position:fixed;inset:0;
  background:var(--bg) center/cover no-repeat;
  filter:blur(28px) brightness(.45);transform:scale(1.15);
}

/* صحنه: نسبت ثابت ۲:۳ مثل خود عکس، تا محتوا همیشه داخل هشتی بماند */
.stage{
  visibility:hidden;
  --u:1cqw;
  position:relative;
  width:min(100vw, calc(100dvh * 2 / 3));
  aspect-ratio:2/3;
  background:var(--bg) center/100% 100% no-repeat;
  container-type:inline-size;
  box-shadow:0 0 60px rgba(0,0,0,.6);
  overflow:hidden;
}

.stage.go{visibility:visible}
.stage:not(.go) *{animation-play-state:paused!important}

/* محتوا دقیقا داخل قاب سبز هشتی */
.content{
  position:absolute;
  left:18%;right:18%;
  top:20%;
  text-align:center;
}

.shop{
  font-family:"Aref Ruqaa","Vazirmatn",serif;
  font-weight:700;
  font-size:calc(9.4 * var(--u));
  line-height:1.3;
  color:var(--gold-soft);
  text-shadow:0 0 18px rgba(232,201,135,.45),0 2px 6px rgba(0,0,0,.6);
  animation:reveal 1.3s cubic-bezier(.25,.7,.2,1) .2s both;
  will-change:transform,opacity,clip-path;
}
.rule{
  height:2px;width:70%;margin:calc(2.2 * var(--u)) auto calc(3 * var(--u));
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  transform-origin:center;
  animation:draw 1.1s ease-out 1.1s both;
}
.owner{
  font-weight:800;font-size:calc(5 * var(--u));
  animation:rise .9s ease-out 1.6s both;
}
.hint{
  font-size:calc(3.2 * var(--u));color:rgba(255,247,230,.72);
  margin:calc(1.2 * var(--u)) 0 calc(5 * var(--u));
  animation:rise .9s ease-out 1.9s both;
}

.field{
  display:block;width:100%;
  background:rgba(8,40,38,.55);
  border:1px solid var(--edge);
  border-radius:calc(3.2 * var(--u));
  padding:calc(3.4 * var(--u)) calc(2 * var(--u)) calc(3 * var(--u));
  margin-bottom:calc(3.6 * var(--u));
  color:inherit;font:inherit;cursor:pointer;
  position:relative;overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,.35);
  transition:background .25s,border-color .25s,transform .12s;
  -webkit-tap-highlight-color:transparent;
  opacity:0;
  animation:slideIn 1s cubic-bezier(.2,.8,.2,1) both;
}
.field:nth-of-type(1){animation-delay:2.2s}
.field:nth-of-type(2){animation-delay:2.7s}
/* برق طلایی هنگام ورود */
.field::after{
  content:"";position:absolute;top:0;bottom:0;width:40%;
  left:-60%;
  background:linear-gradient(100deg,transparent,rgba(248,231,191,.35),transparent);
  transform:skewX(-20deg);
  animation:sheen 1.2s ease-in-out both;
}
.field:nth-of-type(1)::after{animation-delay:3s}
.field:nth-of-type(2)::after{animation-delay:3.5s}

.field:hover{background:rgba(8,60,56,.7)}
.field:active{transform:scale(.982)}
.field:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.field.done{border-color:#9be3ae;background:rgba(40,110,70,.5)}

.label{display:block;font-size:calc(3.5 * var(--u));color:var(--gold);margin-bottom:calc(1.6 * var(--u))}
.value{
  display:block;direction:ltr;
  font-family:"Courier New",ui-monospace,monospace;
  font-weight:700;color:var(--ink);
  user-select:all;-webkit-user-select:all;
}
.value.card{font-size:calc(4.7 * var(--u));letter-spacing:.05em}
.value.sheba{font-size:calc(4 * var(--u));letter-spacing:.04em;line-height:1.5}
.tap{display:block;margin-top:calc(1.6 * var(--u));font-size:calc(2.8 * var(--u));color:rgba(255,247,230,.62)}

/* پیام کپی و تشکر (موقت) */
.toast{
  position:absolute;left:19%;right:19%;
  bottom:19%;
  padding:calc(3 * var(--u)) calc(3 * var(--u));
  text-align:center;
  background:rgba(10,52,46,.94);
  border:1px solid var(--gold);
  border-radius:calc(3.5 * var(--u));
  box-shadow:0 10px 30px rgba(0,0,0,.55),0 0 22px rgba(232,201,135,.35);
  opacity:0;transform:translateY(14px) scale(.96);
  pointer-events:none;
  transition:opacity .35s ease,transform .35s cubic-bezier(.2,.9,.3,1.2);
}
.toast.show{opacity:1;transform:none}
.toast b{display:block;font-size:calc(4.4 * var(--u));color:var(--gold-soft);margin-bottom:.calc(8 * var(--u))}
.toast span{font-size:calc(3.3 * var(--u));color:rgba(255,247,230,.9)}

/* گوشی و هر صفحه‌ی باریک‌تر از ۲:۳ : تمام‌صفحه */
@media (max-aspect-ratio:2/3){
  body::before{display:none}
  .stage{
    position:fixed;inset:0;
    width:100vw;height:100vh;height:100dvh;
    aspect-ratio:auto;box-shadow:none;
    background-size:cover;background-position:center top;
    --s:calc(100dvh / 1536);
    --W:min(calc(var(--s) * 1024), calc((100vw - 32px) / .64));
    --u:calc(var(--W) / 100);
  }
  .content{
    left:calc(50% - var(--W) * .32 - var(--s) * 10);right:auto;
    width:calc(var(--W) * .64);
    top:18dvh;
  }
  .toast{
    left:calc(50% - var(--W) * .31 - var(--s) * 10);right:auto;
    width:calc(var(--W) * .62);
    bottom:17dvh;
  }
}

/* دکمه‌ی موسیقی */
.mbtn{
  position:fixed;z-index:20;
  top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;
  width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--gold-soft);
  background:rgba(8,40,38,.7);
  border:1px solid var(--edge);
  box-shadow:0 4px 14px rgba(0,0,0,.45);
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  opacity:0;animation:rise .9s ease-out 3.2s both;
}
.mbtn[hidden]{display:none}
.mbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.mbtn:not(.on) .w1,.mbtn:not(.on) .w2{display:none}
.mbtn.on .x{display:none}
.mbtn.on{box-shadow:0 0 0 0 rgba(232,201,135,.5),0 4px 14px rgba(0,0,0,.45);animation:rise .9s ease-out 3.2s both,pulse 2.8s ease-out 4.2s infinite}
@keyframes pulse{to{box-shadow:0 0 0 12px rgba(232,201,135,0),0 4px 14px rgba(0,0,0,.45)}}

@keyframes reveal{
  from{opacity:0;clip-path:inset(-20% 0 -20% 100%);transform:translateY(10px) scale(1.04)}
  60%{opacity:1}
  to{opacity:1;clip-path:inset(-20% -5% -20% -5%);transform:none}
}
@keyframes draw{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes slideIn{
  from{opacity:0;transform:translateY(40px) scale(.94)}
  to{opacity:1;transform:none}
}
@keyframes sheen{from{left:-60%}to{left:130%}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .field{opacity:1}
}
</style>

})();
function fallbackCopy(text){
  const t=document.createElement("textarea");
  t.value=text;t.setAttribute("readonly","");
  t.style.cssText="position:fixed;opacity:0;top:0;left:0";
  document.body.appendChild(t);t.select();t.setSelectionRange(0,text.length);
  let ok=false;try{ok=document.execCommand("copy")}catch(e){}
  document.body.removeChild(t);return ok;
}
async function copyText(text){
  try{
    if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true}
  }catch(e){}
  return fallbackCopy(text);
}
const toast=document.getElementById("toast");
const title=toast.querySelector("b"), sub=toast.querySelector("span");
let timer;
document.querySelectorAll(".field").forEach(btn=>{
  btn.addEventListener("click",async()=>{
    const ok=await copyText(btn.dataset.copy);
    document.querySelectorAll(".field").forEach(f=>f.classList.remove("done"));
    if(ok){
      btn.classList.add("done");
      title.textContent="کپی شد ✓";
      sub.textContent="سپاس از شما، پرداخت‌تان مبارک";
    }else{
      title.textContent="کپی انجام نشد";
      sub.textContent="متن را نگه دارید و کپی کنید";
    }
    toast.classList.add("show");
    clearTimeout(timer);
    timer=setTimeout(()=>{
      toast.classList.remove("show");
      btn.classList.remove("done");
    },2600);
  });
});
</script>
<script>
/* موسیقی پس‌زمینه */
(function(){
  const audio=document.getElementById("bgm"), btn=document.getElementById("mbtn");
  const TARGET=.55;
  let wanted=true, fadeTimer;
  const setUI=on=>btn.classList.toggle("on",on);
  const reveal=()=>{ btn.hidden=false; };
  audio.addEventListener("loadedmetadata",reveal);
  audio.addEventListener("canplay",reveal);
  if(audio.readyState>=1) reveal();

  function fadeIn(){
    clearInterval(fadeTimer);
    try{ audio.volume=0; }catch(e){}
    let v=0;
    fadeTimer=setInterval(()=>{
      v=Math.min(TARGET,v+.03);
      try{ audio.volume=v; }catch(e){}
      if(v>=TARGET) clearInterval(fadeTimer);
    },120);
  }
  async function start(){
    if(!wanted||!audio.paused||audio.error) return;
    try{
      await audio.play();
      fadeIn(); setUI(true); unlisten();
    }catch(e){ setUI(false); }
  }
  /* مرورگرها پخش خودکار صدا را تا اولین لمس کاربر مسدود می‌کنند */
  const events=["pointerup","touchend","click","keydown"];
  function onGesture(){ start(); }
  function unlisten(){ events.forEach(ev=>window.removeEventListener(ev,onGesture,true)); }
  events.forEach(ev=>window.addEventListener(ev,onGesture,true));
  start();

  btn.addEventListener("click",e=>{
    e.stopPropagation();
    if(audio.paused){ wanted=true; start(); }
    else{ wanted=false; audio.pause(); setUI(false); }
  });
  audio.addEventListener("pause",()=>{ if(document.visibilityState!=="hidden") setUI(false); });
  audio.addEventListener("play",()=>setUI(true));

  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="hidden"){ if(!audio.paused) audio.pause(); }
    else if(wanted){ start(); }
  });
})();
</script>
</body>
